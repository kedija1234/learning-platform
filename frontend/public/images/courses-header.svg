<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="1200" height="400" fill="#0F766E"/>

  <!-- Subtle Architectural & Mathematical Grid Lines -->
  <g stroke="#0D9488" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Concentric Drafting Circles & Geometry -->
  <g fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.4">
    <circle cx="1020" cy="200" r="160"/>
    <circle cx="1020" cy="200" r="110"/>
    <circle cx="1020" cy="200" r="60"/>
    <circle cx="180" cy="180" r="120"/>
    <circle cx="180" cy="180" r="70"/>
  </g>

  <!-- Diagonal Compass & Ray Lines -->
  <g stroke="#E6FFFA" stroke-width="1" opacity="0.25">
    <line x1="860" y1="40" x2="1180" y2="360"/>
    <line x1="1180" y1="40" x2="860" y2="360"/>
    <line x1="60" y1="60" x2="300" y2="300"/>
  </g>

  <!-- Abstract Stacked Books - Right Group (Isometric Geometry) -->
  <!-- Bottom Large Folio -->
  <path d="M 880 290 L 1080 230 L 1140 260 L 940 320 Z" fill="#0D9488"/>
  <path d="M 880 290 L 940 320 L 940 340 L 880 310 Z" fill="#FAF8F3" opacity="0.9"/>
  <path d="M 940 320 L 1140 260 L 1140 280 L 940 340 Z" fill="#E6FFFA" opacity="0.85"/>
  <line x1="880" y1="290" x2="1080" y2="230" stroke="#FAF8F3" stroke-width="1.5" opacity="0.6"/>

  <!-- Middle Book -->
  <path d="M 895 255 L 1065 205 L 1115 230 L 945 280 Z" fill="#FAF8F3" opacity="0.95"/>
  <path d="M 895 255 L 945 280 L 945 295 L 895 270 Z" fill="#0D9488"/>
  <path d="M 945 280 L 1115 230 L 1115 245 L 945 295 Z" fill="#0D9488" opacity="0.7"/>
  <!-- Amber Bookmark Ribbon -->
  <path d="M 970 273 L 990 320 L 1005 310 L 990 267 Z" fill="#F59E0B"/>

  <!-- Top Open Book -->
  <!-- Left Page -->
  <path d="M 920 220 C 950 215, 980 210, 1005 215 L 1005 160 C 980 155, 950 160, 920 165 Z" fill="#FAF8F3"/>
  <!-- Right Page -->
  <path d="M 1005 215 C 1030 210, 1060 215, 1090 220 L 1090 165 C 1060 160, 1030 155, 1005 160 Z" fill="#E6FFFA"/>
  <!-- Spine Line -->
  <line x1="1005" y1="160" x2="1005" y2="215" stroke="#0D9488" stroke-width="2"/>
  <!-- Abstract Text Lines on Pages -->
  <g stroke="#0D9488" stroke-width="1.2" opacity="0.4">
    <line x1="935" y1="175" x2="990" y2="171"/>
    <line x1="935" y1="185" x2="990" y2="181"/>
    <line x1="935" y1="195" x2="980" y2="192"/>
    <line x1="935" y1="205" x2="970" y2="203"/>

    <line x1="1020" y1="171" x2="1075" y2="175"/>
    <line x1="1020" y1="181" x2="1075" y2="185"/>
    <line x1="1020" y1="192" x2="1065" y2="195"/>
    <line x1="1020" y1="203" x2="1055" y2="205"/>
  </g>

  <!-- Abstract Upright Books - Shelf Composition Mid-Right -->
  <g transform="translate(730, 170)">
    <!-- Book 1 (Tilted) -->
    <rect x="0" y="0" width="22" height="150" rx="3" fill="#0D9488" transform="rotate(-12 0 150)"/>
    <line x1="6" y1="10" x2="6" y2="140" stroke="#FAF8F3" stroke-width="1.5" opacity="0.7" transform="rotate(-12 0 150)"/>
    <rect x="8" y="25" width="6" height="30" fill="#F59E0B" transform="rotate(-12 0 150)"/>

    <!-- Book 2 (Upright) -->
    <rect x="36" y="20" width="28" height="130" rx="3" fill="#FAF8F3" opacity="0.95"/>
    <line x1="42" y1="35" x2="58" y2="35" stroke="#0D9488" stroke-width="2"/>
    <line x1="42" y1="45" x2="54" y2="45" stroke="#0D9488" stroke-width="1.5"/>

    <!-- Book 3 (Wide binder) -->
    <rect x="70" y="5" width="36" height="145" rx="3" fill="#E6FFFA" opacity="0.9"/>
    <circle cx="88" cy="40" r="5" fill="#0F766E"/>
    <line x1="88" y1="60" x2="88" y2="120" stroke="#0D9488" stroke-width="1.5"/>

    <!-- Book 4 (Small) -->
    <rect x="112" y="45" width="20" height="105" rx="2" fill="#0D9488"/>
    <line x1="116" y1="60" x2="128" y2="60" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Left Side Geometric Composition (Drafting triangles & curves) -->
  <polygon points="120,330 280,330 280,110" fill="none" stroke="#FAF8F3" stroke-width="2" opacity="0.6"/>
  <polygon points="160,310 260,310 260,180" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.7"/>
  <circle cx="280" cy="110" r="4" fill="#F59E0B"/>
  <circle cx="280" cy="330" r="4" fill="#0D9488"/>
  <circle cx="120" cy="330" r="4" fill="#0D9488"/>

  <!-- Dynamic Geometric Arc Flow -->
  <path d="M 50 360 C 250 320, 380 200, 480 120" fill="none" stroke="#E6FFFA" stroke-width="2" opacity="0.45"/>
  <path d="M 60 380 C 270 340, 400 220, 500 140" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.5"/>

  <!-- Minimalist Floating Geometric Shapes -->
  <polygon points="560,90 575,115 545,115" fill="#FAF8F3" opacity="0.5"/>
  <polygon points="650,280 670,310 630,310" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
  <rect x="420" y="270" width="16" height="16" fill="none" stroke="#E6FFFA" stroke-width="1.5" opacity="0.6" transform="rotate(45 428 278)"/>
  <circle cx="710" cy="90" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="480" cy="220" r="3" fill="#FAF8F3" opacity="0.7"/>
</svg>