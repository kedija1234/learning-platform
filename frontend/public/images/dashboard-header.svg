<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="1200" height="400" fill="#0F766E"/>

  <!-- Background Isometric Matrix Grid -->
  <g stroke="#0D9488" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left Abstract Progress Dial & Radii -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#E6FFFA" stroke-width="2" stroke-dasharray="16,8" opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FAF8F3" stroke-width="2" opacity="0.6"/>
    <!-- Node Waypoints on Ring -->
    <circle cx="0" cy="-60" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="0" r="4" fill="#FAF8F3"/>
    <circle cx="0" cy="60" r="4" fill="#0D9488"/>
    <circle cx="-60" cy="0" r="4" fill="#E6FFFA"/>
  </g>

  <!-- Center Floating Modular Metric Pillars -->
  <g transform="translate(560, 260)">
    <rect x="-60" y="-120" width="22" height="120" rx="3" fill="#0D9488" opacity="0.8"/>
    <rect x="-30" y="-160" width="22" height="160" rx="3" fill="#FAF8F3" opacity="0.9"/>
    <rect x="0" y="-90" width="22" height="90" rx="3" fill="#E6FFFA" opacity="0.75"/>
    <rect x="30" y="-200" width="22" height="200" rx="3" fill="#0D9488"/>
    <!-- Amber Target Indicator on Highest Metric -->
    <circle cx="41" cy="-215" r="5" fill="#F59E0B"/>
    <!-- Horizontal Baseline -->
    <line x1="-80" y1="0" x2="70" y2="0" stroke="#FAF8F3" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Right Geometric Modular Cards & Connections -->
  <g transform="translate(880, 100)">
    <!-- Main Card Outline -->
    <rect x="0" y="20" width="220" height="160" rx="8" fill="none" stroke="#FAF8F3" stroke-width="2" opacity="0.75"/>
    <!-- Card Header Strip -->
    <rect x="0" y="20" width="220" height="35" rx="8" fill="#0D9488" opacity="0.6"/>
    <line x1="20" y1="38" x2="80" y2="38" stroke="#FAF8F3" stroke-width="3" stroke-linecap="round"/>
    <!-- Card Content Elements -->
    <rect x="20" y="75" width="45" height="10" rx="2" fill="#E6FFFA" opacity="0.8"/>
    <rect x="20" y="95" width="120" height="6" rx="2" fill="#FAF8F3" opacity="0.5"/>
    <rect x="20" y="110" width="90" height="6" rx="2" fill="#FAF8F3" opacity="0.4"/>
    <rect x="20" y="125" width="140" height="6" rx="2" fill="#FAF8F3" opacity="0.3"/>
    <!-- Amber Mini Badge inside Card -->
    <rect x="155" y="70" width="45" height="20" rx="4" fill="#F59E0B"/>

    <!-- Linked Secondary Module -->
    <rect x="50" y="140" width="190" height="110" rx="6" fill="#0D9488" opacity="0.9"/>
    <line x1="70" y1="165" x2="130" y2="165" stroke="#FAF8F3" stroke-width="2"/>
    <line x1="70" y1="185" x2="180" y2="185" stroke="#E6FFFA" stroke-width="1.5" opacity="0.8"/>
    <line x1="70" y1="205" x2="150" y2="205" stroke="#E6FFFA" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Connecting Vector Flow Lines -->
  <path d="M 290 200 C 420 120, 520 180, 680 140" fill="none" stroke="#E6FFFA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <path d="M 700 240 C 760 210, 800 170, 880 140" fill="none" stroke="#FAF8F3" stroke-width="2" opacity="0.65"/>
  <circle cx="700" cy="240" r="4" fill="#F59E0B"/>
  <circle cx="880" cy="140" r="4" fill="#E6FFFA"/>
</svg>