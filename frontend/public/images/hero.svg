<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="1200" height="600" fill="#0F766E"/>

  <!-- Geometric Coordinate Grid -->
  <g stroke="#0D9488" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="1050" y1="0" x2="1050" y2="600"/>
  </g>

  <!-- Large Orbital Arcs & Celestial Compass -->
  <g fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.4">
    <circle cx="600" cy="300" r="280"/>
    <circle cx="600" cy="300" r="200" stroke-dasharray="10,6"/>
    <circle cx="600" cy="300" r="120"/>
    <circle cx="600" cy="300" r="40"/>
  </g>

  <!-- Left Side: University Academics (Abstract Geometric Library & Arch) -->
  <g transform="translate(140, 240)">
    <!-- Base Campus Pedestal -->
    <polygon points="0,240 280,240 240,180 40,180" fill="#0D9488" opacity="0.8"/>
    <!-- Academic Portico Pillars -->
    <rect x="50" y="60" width="16" height="120" fill="#FAF8F3" opacity="0.9"/>
    <rect x="90" y="60" width="16" height="120" fill="#FAF8F3" opacity="0.9"/>
    <rect x="130" y="60" width="16" height="120" fill="#FAF8F3" opacity="0.9"/>
    <rect x="170" y="60" width="16" height="120" fill="#FAF8F3" opacity="0.9"/>
    <rect x="210" y="60" width="16" height="120" fill="#FAF8F3" opacity="0.9"/>
    <!-- Pediment Triangle -->
    <polygon points="35,60 138,-15 241,60" fill="#E6FFFA" opacity="0.85"/>
    <polygon points="65,55 138,5 211,55" fill="#0D9488"/>
    <!-- Amber Acroterion Peak -->
    <circle cx="138" cy="-22" r="6" fill="#F59E0B"/>

    <!-- Open Knowledge Books beside Campus -->
    <path d="M 200 190 C 230 180, 260 175, 280 180 L 280 130 C 260 125, 230 130, 200 140 Z" fill="#FAF8F3"/>
    <path d="M 280 180 C 300 175, 330 180, 360 190 L 360 140 C 330 130, 300 125, 280 130 Z" fill="#E6FFFA"/>
    <line x1="280" y1="130" x2="280" y2="180" stroke="#0D9488" stroke-width="2"/>
  </g>

  <!-- Right Side: Corporate & Industry Skyline (Abstract Geometric Towers) -->
  <g transform="translate(760, 160)">
    <!-- Tower A (Angular Corporate HQ) -->
    <polygon points="60,320 60,100 140,50 140,320" fill="#0D9488"/>
    <!-- Window Bands -->
    <g fill="#FAF8F3" opacity="0.85">
      <rect x="75" y="110" width="12" height="18" rx="1"/>
      <rect x="95" y="98" width="12" height="18" rx="1"/>
      <rect x="115" y="85" width="12" height="18" rx="1"/>

      <rect x="75" y="145" width="12" height="18" rx="1"/>
      <rect x="95" y="145" width="12" height="18" rx="1"/>
      <rect x="115" y="145" width="12" height="18" rx="1"/>

      <rect x="75" y="180" width="12" height="18" rx="1"/>
      <rect x="95" y="180" width="12" height="18" rx="1"/>
      <rect x="115" y="180" width="12" height="18" rx="1"/>

      <rect x="75" y="215" width="12" height="18" rx="1"/>
      <rect x="95" y="215" width="12" height="18" rx="1"/>
      <rect x="115" y="215" width="12" height="18" rx="1"/>
    </g>
    <!-- Amber Antenna Marker -->
    <line x1="140" y1="50" x2="140" y2="20" stroke="#FAF8F3" stroke-width="2"/>
    <circle cx="140" cy="16" r="5" fill="#F59E0B"/>

    <!-- Tower B (Glass Monolith) -->
    <rect x="160" y="130" width="110" height="190" fill="#FAF8F3" opacity="0.95"/>
    <g stroke="#0D9488" stroke-width="1.5" opacity="0.6">
      <line x1="190" y1="140" x2="190" y2="310"/>
      <line x1="220" y1="140" x2="220" y2="310"/>
      <line x1="250" y1="140" x2="250" y2="310"/>
    </g>

    <!-- Tower C (Background Terraces) -->
    <rect x="285" y="180" width="80" height="140" fill="#E6FFFA" opacity="0.7"/>
    <rect x="305" y="150" width="40" height="30" fill="#E6FFFA" opacity="0.7"/>
    <circle cx="325" cy="140" r="4" fill="#F59E0B"/>
  </g>

  <!-- Central Bridge Connecting University & Career -->
  <g>
    <!-- Bridge Arch Span -->
    <path d="M 380 440 C 480 340, 720 340, 820 440" fill="none" stroke="#FAF8F3" stroke-width="4"/>
    <path d="M 400 460 C 500 370, 700 370, 800 460" fill="none" stroke="#E6FFFA" stroke-width="2"/>

    <!-- Bridge Vertical Suspensions -->
    <g stroke="#0D9488" stroke-width="1.5" opacity="0.75">
      <line x1="480" y1="375" x2="480" y2="445"/>
      <line x1="530" y1="358" x2="530" y2="445"/>
      <line x1="580" y1="352" x2="580" y2="445"/>
      <line x1="620" y1="352" x2="620" y2="445"/>
      <line x1="670" y1="358" x2="670" y2="445"/>
      <line x1="720" y1="375" x2="720" y2="445"/>
    </g>

    <!-- Center Keystone Emblem on Bridge -->
    <polygon points="600,320 620,352 580,352" fill="#F59E0B"/>
    <circle cx="600" cy="310" r="5" fill="#FAF8F3"/>
  </g>

  <!-- Career Trajectory Line & Rising Vectors -->
  <path d="M 180 500 C 400 440, 600 240, 950 140" fill="none" stroke="#FAF8F3" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.8"/>
  <circle cx="480" cy="385" r="5" fill="#FAF8F3"/>
  <circle cx="600" cy="240" r="6" fill="#F59E0B"/>
  <circle cx="780" cy="175" r="5" fill="#E6FFFA"/>
</svg>